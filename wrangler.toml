name = "globe"
compatibility_date = "2026-09-13"
main = "src/worker.ts"

[analytics]
binding = "ANALYTICS_SQL"

[[analytics_engine_datasets]]
binding = "GLOBE_EVENTS"
dataset = "globe_product_events"

[assets]
directory = "./dist"
not_found_handling = "single-page-application"

# Feedback storage (optional). Create a KV namespace and paste its id below:
# [[kv_namespaces]]
# binding = "FEEDBACK_KV"
# id = "YOUR_KV_NAMESPACE_ID"
#
# Or set a secret: wrangler secret put FEEDBACK_WEBHOOK_URL
# (e.g. a Formspree/Zapier/email webhook URL)
